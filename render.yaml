databases:
  - name: food-tracker-db
    plan: free
    databaseName: food_tracking

services:
  - type: web
    name: food-tracker
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: food-tracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
